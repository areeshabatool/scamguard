[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamguard"
version = "0.1.0"
description = "Defensive agent that classifies forwarded messages as scam, suspicious, benign or unsure."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["starter"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses calls (Form/File/Depends/...) as argument defaults by design; not B008.
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["scamguard", "eval"]
